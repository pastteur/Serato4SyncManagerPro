[package]
name = "serato4-sync-pro"
version = "1.0.0"
description = "Serato 4 Sync Manager Pro"
authors = ["Pastteur"]
edition = "2021"

[lib]
name = "serato4_sync_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
