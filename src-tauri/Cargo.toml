[package]
name = "serato5-sync-pro"
version = "5.0.0"
description = "Serato 5 Sync Manager Pro"
authors = ["Pastteur"]
edition = "2021"

[lib]
name = "serato5_sync_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
notify = "6.1"
