<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Vinyl Rim -->
  <circle cx="256" cy="256" r="180" fill="#10131c" stroke="#252c40" stroke-width="6"/>
  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#192033" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#202942" stroke-width="3"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#192033" stroke-width="3" stroke-dasharray="10 8"/>
  
  <!-- Center Vinyl Label -->
  <circle cx="256" cy="256" r="64" fill="url(#gold)"/>
  <!-- Center Spindle Hole -->
  <circle cx="256" cy="256" r="20" fill="#08090d" stroke="url(#cyan)" stroke-width="5"/>
  
  <!-- Modern Lightning / Sync Accent -->
  <path d="M268 110 L220 236 L260 236 L244 330 L300 210 L256 210 Z" fill="url(#cyan)" opacity="0.9"/>
  
  <!-- Serato "4" Badge -->
  <rect x="330" y="330" width="110" height="110" rx="30" fill="#0c0e14" stroke="url(#gold)" stroke-width="5"/>
  <text x="385" y="410" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="80" font-weight="900" fill="url(#gold)" text-anchor="middle">4</text>
</svg>
